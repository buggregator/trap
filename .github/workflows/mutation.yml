---

name: 🧬 Mutation testing

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: Infection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets
          coverage: xdebug
          ini-values: memory_limit=-1

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked

      # The Infection phar is unusable with Testo: its bundled adapter calls the
      # unscoped \Infection\StreamWrapper\IncludeInterceptor.
      - name: 📥 Install Infection
        run: composer bin infection install --no-interaction --no-progress

      - name: 🧬 Run Infection
        run: composer infect:ci
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ github.event_name == 'push' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
