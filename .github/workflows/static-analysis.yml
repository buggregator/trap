---

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - master

name: 🔍 Static analysis

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  psalm:
    uses: spiral/gh-actions/.github/workflows/psalm.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.2']
      bin-tool: psalm
      command: composer psalm:ci

  structarmed:
    timeout-minutes: 4
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        php-version:
          - '8.2'
        dependencies:
          - locked
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda  # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 📥 Install boundwize/structarmed
        run: composer bin structarmed install --no-interaction --no-progress

      - name: 🏛️ Check architectural layer dependencies using boundwize/structarmed
        run: composer structarmed:ci
