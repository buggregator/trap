---

name: 📦 Build binary

on:  # yamllint disable-line rule:truthy
  # A release created by release-please with GITHUB_TOKEN fires no `release` event,
  # so create-release.yml calls this workflow directly.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        type: string
        required: true
  release:
    types:
      - published
  # Builds without a release: the archives are kept as workflow artifacts.
  pull_request:
    paths:
      - .github/workflows/build-bin-release.yml
      - Dockerfile
      - box.json.dist

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  SPC_VERSION: 2.8.5

jobs:
  build-unix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: 📦 Build Unix Executables
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${RELEASE_TAG:-dev}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "{\"version\": \"$VERSION\", \"type\":\"bin\"}" > version.json

      - name: Build Docker image for ${{ matrix.platform.os }}-${{ matrix.platform.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: trap-builder-${{ matrix.platform.os }}-${{ matrix.platform.arch }}:latest
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            TARGET_OS=${{ matrix.platform.os }}
            TARGET_ARCH=${{ matrix.platform.arch }}
            VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform.os }}-${{ matrix.platform.arch }}

      - name: Extract executable
        run: |
          mkdir -p dist
          container_id=$(docker create trap-builder-${{ matrix.platform.os }}-${{ matrix.platform.arch }}:latest)
          docker cp $container_id:/.output/trap ./dist/trap
          docker rm $container_id

      - name: Archive executable
        run: >-
          tar --format=ustar --owner=0 --group=0 --numeric-owner -C dist
          -czf "trap-${VERSION}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.tar.gz" trap

      - name: 📤 Upload release assets
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./trap-${{ env.VERSION }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.tar.gz

      - name: 📤 Upload artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: trap-${{ env.VERSION }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: ./trap-${{ env.VERSION }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos-arm64:
    runs-on: macos-15
    permissions:
      contents: write
    name: 📦 Build macOS ARM64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sockets
          coverage: none

      - name: Extract version from tag or set dev version
        id: get_version
        shell: bash
        run: |
          VERSION=${RELEASE_TAG:-dev}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "{\"version\": \"$VERSION\", \"type\":\"bin\"}" > version.json

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --ignore-platform-reqs

      - name: Create build directories
        run: mkdir -p .build/phar .build/bin dist

      - name: Download box tool
        run: |
          curl -fsSL -o .build/bin/box.phar https://github.com/box-project/box/releases/download/4.6.6/box.phar
          chmod +x .build/bin/box.phar

      - name: Download SPC for macOS ARM64
        run: |
          curl -fsSL "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/spc-macos-aarch64.tar.gz" | tar -xz -C .build/bin spc
          chmod +x .build/bin/spc

      - name: Download required PHP extensions
        run: |
          export SPC_SKIP_BREW_INSTALL=1
          .build/bin/spc download micro --for-extensions=ctype,dom,filter,libxml,mbstring,phar,simplexml,sockets,tokenizer,xml,xmlwriter --with-php=8.3 --prefer-pre-built
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify environment is ready
        run: |
          export SPC_SKIP_BREW_INSTALL=1
          .build/bin/spc doctor --auto-fix

      - name: Build PHAR file
        run: |
          php .build/bin/box.phar compile -v

      - name: Build the self-executable binary
        run: |
          # Skip Homebrew installation (we don't need it)
          export SPC_SKIP_BREW_INSTALL=1
          .build/bin/spc build "ctype,dom,filter,libxml,mbstring,phar,simplexml,sockets,tokenizer,xml,xmlwriter" --build-micro

      - name: Combine micro.sfx with the PHAR
        run: |
          .build/bin/spc micro:combine .build/phar/trap.phar --output=dist/trap

      - name: Test binary
        run: |
          chmod +x dist/trap
          dist/trap --help

      - name: Archive executable
        run: >-
          tar --format ustar --uid 0 --gid 0 --numeric-owner --no-mac-metadata -C dist
          -czf "trap-${VERSION}-darwin-arm64.tar.gz" trap

      - name: 📤 Upload release assets
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./trap-${{ env.VERSION }}-darwin-arm64.tar.gz

      - name: 📤 Upload artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: trap-${{ env.VERSION }}-darwin-arm64
          path: ./trap-${{ env.VERSION }}-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos-amd64:
    runs-on: macos-15-intel
    permissions:
      contents: write
    name: 📦 Build macOS (x64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sockets
          coverage: none

      - name: Extract version from tag or set dev version
        id: get_version
        shell: bash
        run: |
          VERSION=${RELEASE_TAG:-dev}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "{\"version\": \"$VERSION\", \"type\":\"bin\"}" > version.json

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --ignore-platform-reqs

      - name: Create build directories
        run: mkdir -p .build/phar .build/bin dist

      - name: Download SPC for macOS AMD64
        run: |
          curl -fsSL "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/spc-macos-x86_64.tar.gz" | tar -xz -C .build/bin spc
          chmod +x .build/bin/spc

      - name: Download box tool
        run: |
          curl -fsSL -o .build/bin/box.phar https://github.com/box-project/box/releases/download/4.6.6/box.phar
          chmod +x .build/bin/box.phar

      - name: Download required PHP extensions
        run: |
          .build/bin/spc download micro --for-extensions=ctype,dom,filter,libxml,mbstring,phar,simplexml,sockets,tokenizer,xml,xmlwriter --with-php=8.3 --prefer-pre-built
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify environment is ready
        run: |
          .build/bin/spc doctor --auto-fix

      - name: Build PHAR file
        run: |
          php .build/bin/box.phar compile -v

      - name: Build the self-executable binary
        run: |
          .build/bin/spc build "ctype,dom,filter,libxml,mbstring,phar,simplexml,sockets,tokenizer,xml,xmlwriter" --build-micro

      - name: Combine micro.sfx with the PHAR
        run: |
          .build/bin/spc micro:combine .build/phar/trap.phar --output=dist/trap

      - name: Test binary
        run: |
          chmod +x dist/trap
          dist/trap --help

      - name: Archive executable
        run: >-
          tar --format ustar --uid 0 --gid 0 --numeric-owner --no-mac-metadata -C dist
          -czf "trap-${VERSION}-darwin-amd64.tar.gz" trap

      - name: 📤 Upload release assets
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./trap-${{ env.VERSION }}-darwin-amd64.tar.gz

      - name: 📤 Upload artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: trap-${{ env.VERSION }}-darwin-amd64
          path: ./trap-${{ env.VERSION }}-darwin-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    name: 📦 Build Windows (x64)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sockets
          coverage: none

      - name: Extract version from tag or set dev version
        id: get_version
        shell: bash
        run: |
          VERSION=${RELEASE_TAG:-dev}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "{\"version\": \"$VERSION\", \"type\":\"bin\"}" > version.json

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --ignore-platform-reqs

      - name: Create build directories
        run: New-Item -Path ".build\phar", ".build\bin" -ItemType Directory -Force

      - name: Download box tool
        run: |
          Invoke-WebRequest -Uri "https://github.com/box-project/box/releases/download/4.6.6/box.phar" -OutFile ".build/bin/box.phar"

      - name: Download SPC for Windows
        run: |
          Invoke-WebRequest -Uri "https://github.com/crazywhalecc/static-php-cli/releases/download/$env:SPC_VERSION/spc-windows-x64.exe" -OutFile ".build/bin/spc.exe"

      - name: Download required PHP extensions
        run: .build/bin/spc.exe download micro --for-extensions=ctype,dom,filter,libxml,mbstring,phar,simplexml,sockets,tokenizer,xml,xmlwriter --with-php=8.3 --prefer-pre-built

      #   todo: fix this
      #      - name: Install UPX for compression
      #        run: |
      #          .build/bin/spc.exe install-pkg upx

      - name: Verify environment is ready
        run: |
          .build/bin/spc.exe doctor --auto-fix

      - name: Build the self-executable binary
        run: .build/bin/spc.exe build "ctype,dom,filter,libxml,mbstring,phar,simplexml,sockets,tokenizer,xml,xmlwriter" --build-micro # --with-upx-pack

      - name: Build PHAR file
        run: |
          php .build/bin/box.phar compile -v --allow-composer-check-failure

      - name: Combine micro.sfx with the PHAR
        run: |
          New-Item -Path "dist" -ItemType Directory -Force
          .build\bin\spc.exe micro:combine .build\phar\trap.phar --output=dist\trap.exe

      - name: Test binary
        run: dist\trap.exe --help

      # Windows' own bsdtar: Git's GNU tar would read a drive letter in a path as a remote host.
      - name: Archive executable
        run: >-
          C:\Windows\System32\tar.exe --format ustar --uid 0 --gid 0 --numeric-owner -C dist
          -czf "trap-${env:VERSION}-windows-amd64.tar.gz" trap.exe

      - name: 📤 Upload release assets
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./trap-${{ env.VERSION }}-windows-amd64.tar.gz

      - name: 📤 Upload artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: trap-${{ env.VERSION }}-windows-amd64
          path: ./trap-${{ env.VERSION }}-windows-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
