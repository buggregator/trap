---

# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration. For more information, see:
# https://github.com/actions/labeler/blob/master/README.md
#
# `pull_request_target` gives fork PRs a token that can write labels.
# It is safe only while no job checks out or runs code from the PR:
# the labeler reads `.github/labeler.yml` from the base branch via the API.

on:  # yamllint disable-line rule:truthy
  pull_request_target:

name: 🏷️ Add labels

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    uses: wayofdev/gh-actions/.github/workflows/apply-labels.yml@v3.3.0
    with:
      os: ubuntu-latest
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

...
