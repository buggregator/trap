---

name: 🧪 Unit testing

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      dependencies: >-
        ['locked', 'highest']
      codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  acceptance-windows:
    name: Acceptance (PHP 8.4, windows-latest)
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked

      - name: 🧪 Run acceptance tests
        run: vendor/bin/testo --suite=Acceptance

  compile-phar:
    timeout-minutes: 4
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        php-version:
          - '8.2'
        dependencies:
          - locked
    env:
      TRAP_PHAR: ".build/phar/trap.phar"
      TRAP_PHAR_SIGNATURE: ".build/phar/trap.phar.asc"
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: 'error_reporting=E_ALL, memory_limit=-1, phar.readonly=0'
          tools: composer, box
          coverage: none

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-dev"
          dependency-versions: ${{ matrix.dependencies }}

      - name: 🔍 Validate configuration for box-project/box
        run: box validate box.json.dist --ansi

      - name: 📦 Build PHAR
        run: box compile

      - name: 💥 Show info about phar with box-project/box
        run: box info ${{ env.TRAP_PHAR }} --ansi

      - name: 🤔 Run trap.phar help command
        run: ${{ env.TRAP_PHAR }} --help
